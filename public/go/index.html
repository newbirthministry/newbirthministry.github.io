<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open in Maps</title>
  <style>body{font-family:system-ui,Arial,sans-serif;padding:1rem}</style>
</head>
<body>
  <p>Opening map… If nothing happens, <a id="fallback" href="#">click here</a>.</p>

  <script>
    // Redirect helper: supports ?lat=..&lon=..&label=...
    const qs = new URLSearchParams(location.search);
    const lat = qs.get('lat');
    const lon = qs.get('lon');
    const label = qs.get('label') || '';

    if (!lat || !lon) {
      document.getElementById('fallback').textContent = 'Return to site';
      document.getElementById('fallback').href = '/';
      throw new Error('Missing coordinates');
    }

    const encodedLabel = encodeURIComponent(label);
    const apple = `https://maps.apple.com/?ll=${lat},${lon}&q=${encodedLabel}`;
    const googleWeb = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
    const osm = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=17/${lat}/${lon}`;
    const geo = `geo:${lat},${lon}`;

    // Fallback href shown to the user if automatic redirect fails
    const fallbackEl = document.getElementById('fallback');
    fallbackEl.href = googleWeb;

    const ua = navigator.userAgent || '';
    // Prefer Apple Maps on iOS devices
    if (/iPad|iPhone|iPod/.test(ua) && !/CriOS|FxiOS/.test(ua)) {
      location.replace(apple);
    } else if (/Android/.test(ua)) {
      // Opening google web link usually launches Google Maps app if installed
      location.replace(googleWeb);
    } else {
      // Desktop / unknown: open Google Maps web, with OpenStreetMap as alternative
      // Try Google first, then OSM
      location.replace(googleWeb);
    }

    // Meta-refresh fallback after short delay (in case JS navigation blocked)
    setTimeout(() => { location.replace(googleWeb); }, 1500);
  </script>
</body>
</html>
